name: Agentes de catalogação e observação
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: artifacts/source-observations.json
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - run: npm run monitor:sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-editorial
          path: artifacts/
          retention-days: 30
